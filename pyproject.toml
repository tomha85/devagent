[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devagent-ai"
version = "0.8.0"
description = "Evidence-driven local autonomous software engineering agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tom Ha"}]
maintainers = [{name = "Tom Ha"}]
keywords = ["ai", "agent", "developer-tools", "software-engineering", "verification", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "openai>=1.40.0",
  "anthropic>=0.34.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
devagent = "devagent.cli:main"
devagent-ui-check = "devagent.browser:main"
devagent-autonomy = "devagent.autonomy:main"
devagent-skills = "devagent.skills:main"
devagent-automation = "devagent.automations:main"
devagent-provider-benchmark = "devagent.provider_benchmark:main"

[project.urls]
Homepage = "https://github.com/tomha85/devagent"
Repository = "https://github.com/tomha85/devagent"
Issues = "https://github.com/tomha85/devagent/issues"
Changelog = "https://github.com/tomha85/devagent/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["devagent*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
