[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devagent-local"
version = "0.2.0"
description = "Evidence-driven local autonomous software engineering agent"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Tom Ha"}]
maintainers = [{name = "Tom Ha"}]
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "openai>=1.40.0",
  "anthropic>=0.34.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
devagent = "devagent.cli:main"

[project.urls]
Homepage = "https://github.com/tomha85/devagent"
Repository = "https://github.com/tomha85/devagent"
Issues = "https://github.com/tomha85/devagent/issues"

[tool.setuptools.packages.find]
include = ["devagent*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
