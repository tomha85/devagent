name: v0.3.2 Requirement Input Path Verification

on:
  push:
    branches:
      - feat/branch-publish-reporting-v032

permissions:
  contents: read

concurrency:
  group: v032-input-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development package
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q devagent

      - name: Run tests
        run: pytest -q

      - name: Check whitespace
        run: git diff --check

      - name: Verify CLI input help
        run: |
          devagent --help | grep -- "--input PATH"
          devagent --help | grep -- "extension is unrestricted"
