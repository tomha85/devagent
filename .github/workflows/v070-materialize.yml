# One-time branch-only materialization; removed after the final product commit is pushed.
name: v0.7 one-time materializer

on:
  push:
    branches: [feat/v070-engineering-breadth]
    paths:
      - scripts/materialize_v070.py
      - .github/workflows/v070-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v070-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/v070-engineering-breadth
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Keep workflow mutations out of the runner push
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/materialize_v070.py')
          text = path.read_text(encoding='utf-8')
          ci_block = '''replace_once(
              ".github/workflows/ci.yml",
              ''' + "'''" + '''          make --version | head -1
          ''' + "'''" + ''',
              ''' + "'''" + '''          make --version | head -1
                    java -version
                    mvn -version | head -1
                    dotnet --version
          ''' + "'''" + ''',
          )
          '''
          if ci_block not in text:
              raise SystemExit('expected CI materializer block not found')
          text = text.replace(ci_block, '', 1)
          cleanup = '''workflow = ROOT / ".github" / "workflows" / "v070-materialize.yml"
          self_path = Path(__file__).resolve()
          if workflow.exists():
              workflow.unlink()
          self_path.unlink()
          '''
          if cleanup not in text:
              raise SystemExit('expected workflow cleanup block not found')
          text = text.replace(cleanup, '''self_path = Path(__file__).resolve()
          self_path.unlink()
          ''', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Materialize final v0.7 candidate
        run: python scripts/materialize_v070.py

      - name: Verify generated commit is clean
        run: git status --short

      - name: Push final candidate
        run: git push origin HEAD:feat/v070-engineering-breadth
