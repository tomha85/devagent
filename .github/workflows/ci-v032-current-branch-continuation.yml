name: v0.3.2 Current Branch Continuation

on:
  push:
    branches:
      - feat/branch-publish-reporting-v032

permissions:
  contents: write

jobs:
  apply-verify-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/branch-publish-reporting-v032
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Normalize patch input
        run: python .devagent-prepatch-current-branch.py

      - name: Apply current-branch continuation patch
        run: python .devagent-patch-current-branch.py

      - name: Compile
        run: python -m compileall devagent

      - name: Test
        run: pytest -q

      - name: Check patch formatting
        run: git diff --check

      - name: Remove temporary patch machinery
        run: |
          rm .devagent-prepatch-current-branch.py
          rm .devagent-patch-current-branch.py
          rm .github/workflows/ci-v032-current-branch-continuation.yml

      - name: Commit verified implementation
        run: |
          git config user.name "Tom Ha"
          git config user.email "31414852+tomha85@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: continue verified work on current development branch"
          git push origin HEAD:feat/branch-publish-reporting-v032
