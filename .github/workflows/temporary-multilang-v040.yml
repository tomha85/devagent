name: Temporary Multi-language v0.4 Qualification

on:
  push:
    branches:
      - feat/production-9of10-release-v040

permissions:
  contents: write

concurrency:
  group: temp-multilang-v040
  cancel-in-progress: true

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/production-9of10-release-v040
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm qualification toolchains
        run: |
          node --version
          npm --version
          go version
          cargo --version
          c++ --version | head -1
          make --version | head -1

      - name: Apply multi-language patch
        run: python .devagent-multilang-v040-patch.py

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q devagent tests

      - name: Full tests with coverage
        run: |
          python -m pytest -q \
            --cov=devagent \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Production qualification v3
        run: |
          python -m devagent.qualification \
            --catalog evaluation/benchmark_v3.json \
            --report .devagent/production-qualification-v3.json

      - name: Diff check
        run: git diff --check

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            devagent/orchestrator.py \
            devagent/technical_review.py \
            devagent/workspace.py \
            evaluation/benchmark_v3.json \
            tests/test_functional_qualification.py \
            README.md \
            evaluation/README.md \
            CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'feat: qualify multi-language acceptance evidence'
          git push origin HEAD:feat/production-9of10-release-v040
