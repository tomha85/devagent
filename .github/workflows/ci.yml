name: Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q devagent

      - name: Run test suite with coverage gate
        run: |
          python -m pytest -q \
            --cov=devagent \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Check patch whitespace
        run: git diff --check

      - name: Smoke-test CLI
        run: |
          devagent --version
          devagent --help >/dev/null

      - name: Validate installed dependencies
        run: python -m pip check

  qualification:
    name: Functional qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run functional qualification catalog
        run: |
          python -m devagent.qualification \
            --catalog evaluation/benchmark_v2.json \
            --report .devagent/functional-qualification.json

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/devagent-wheel-smoke
          /tmp/devagent-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/devagent-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/devagent-wheel-smoke/bin/devagent --version
          /tmp/devagent-wheel-smoke/bin/devagent --help >/dev/null
          /tmp/devagent-wheel-smoke/bin/python -m pip check
