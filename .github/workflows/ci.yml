name: Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q devagent

      - name: Run test suite with coverage gate
        run: |
          python -m pytest -q \
            --cov=devagent \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Check patch whitespace
        run: git diff --check

      - name: Smoke-test CLI
        run: |
          devagent --version
          devagent --help >/dev/null
          devagent benchmark --help >/dev/null
          devagent-ui-check --help >/dev/null

      - name: Validate installed dependencies
        run: python -m pip check

  qualification:
    name: Production qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Confirm supported qualification toolchains
        run: |
          python --version
          node --version
          npm --version
          go version
          cargo --version
          c++ --version | head -1
          make --version | head -1
          java -version
          mvn -version | head -1
          dotnet --version

      - name: Install Linux sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-utils
          bwrap --version

          # Ubuntu 24.04 enables AppArmor restrictions for unprivileged user
          # namespaces. Grant only /usr/bin/bwrap the userns permission it needs
          # to create the isolated network namespace; do not disable AppArmor or
          # the host-wide userns restriction.
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke-test real Linux sandbox backend
        env:
          DEVAGENT_SANDBOX: required
          DEVAGENT_NETWORK: deny
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from pathlib import Path
          from devagent.artifacts import RunArtifacts
          from devagent.workspace import Workspace

          with tempfile.TemporaryDirectory(prefix="devagent-bwrap-smoke-") as temporary:
              base = Path(temporary)
              source = base / "source"
              worktree = base / "worktree"
              source.mkdir()
              worktree.mkdir()
              artifacts = RunArtifacts(source, run_id="ci-real-bwrap")
              workspace = Workspace(worktree, artifacts)
              result = workspace.run(
                  (sys.executable, "--version"),
                  phase="sandbox-smoke",
              )
              print("sandbox backend:", workspace.runtime.backend)
              print("exit:", result.exit_code)
              print("stdout:", result.stdout)
              print("stderr:", result.stderr)
              if not result.passed:
                  raise SystemExit(1)
          PY

      - name: Run production qualification catalog in required sandbox
        env:
          DEVAGENT_SANDBOX: required
          DEVAGENT_NETWORK: deny
        run: |
          python -m devagent.qualification \
            --catalog evaluation/benchmark_v4.json \
            --report .devagent/production-qualification-v4.json

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-qualification-v4
          path: .devagent/production-qualification-v4.json
          if-no-files-found: warn

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/devagent-wheel-smoke
          /tmp/devagent-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/devagent-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/devagent-wheel-smoke/bin/devagent --version
          /tmp/devagent-wheel-smoke/bin/devagent --help >/dev/null
          /tmp/devagent-wheel-smoke/bin/devagent benchmark --help >/dev/null
          /tmp/devagent-wheel-smoke/bin/devagent-ui-check --help >/dev/null
          /tmp/devagent-wheel-smoke/bin/python -m pip check
