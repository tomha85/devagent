name: Controls Platform Qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controls-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    name: Deterministic controls vertical slice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run focused Controls tests
        run: |
          python -m pytest -q             tests/test_controls_spec_v1.py             tests/test_controls_ir_v1.py             tests/test_controls_determinism_v1.py             tests/test_controls_fail_closed_v1.py             tests/test_controls_entrypoint_v1.py             tests/test_controls_live_authority_regression_v1.py             tests/test_controls_catalog_v1.py             tests/test_controls_rockwell_generation_v1.py             tests/test_controls_ignition_fat_v1.py             tests/test_controls_build_pipeline_v1.py             tests/test_controls_portal_v1.py

      - name: Build deterministic vertical slice
        run: |
          rm -rf .devagent/controls-ci-build
          devagent controls validate examples/controls/conveyor_v1.json
          devagent controls build             examples/controls/conveyor_v1.json             --output-dir .devagent/controls-ci-build
          devagent controls verify .devagent/controls-ci-build

      - name: Prove build reproducibility
        run: |
          rm -rf /tmp/controls-build-a /tmp/controls-build-b
          devagent controls build examples/controls/conveyor_v1.json --output-dir /tmp/controls-build-a
          devagent controls build examples/controls/conveyor_v1.json --output-dir /tmp/controls-build-b
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads((Path("/tmp/controls-build-a")/"generation-manifest.json").read_text())
          b=json.loads((Path("/tmp/controls-build-b")/"generation-manifest.json").read_text())
          assert a["spec_sha256"] == b["spec_sha256"]
          assert a["controls_ir_sha256"] == b["controls_ir_sha256"]
          assert a["artifact_sha256"] == b["artifact_sha256"]
          print("CONTROLS_REPRODUCIBILITY=PASS")
          PY

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controls-platform-v1-evidence
          path: .devagent/controls-ci-build
          if-no-files-found: error
