name: Release version after main merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-version-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Build smoke and ensure GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project["version"]
          assert project["name"] == "devagent-ai", project["name"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), version

          init_text = pathlib.Path("devagent/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_text)
          assert match and match.group(1) == version, (match.group(1) if match else None, version)

          pathlib.Path("release-version.txt").write_text(f"v{version}\n", encoding="utf-8")
          PY
          echo "tag=$(cat release-version.txt)" >> "$GITHUB_OUTPUT"
          rm release-version.txt

      - name: Verify exact main revision
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Build and smoke-test release artifacts
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf dist build
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/devagent-release-smoke
          /tmp/devagent-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/devagent-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/devagent-release-smoke/bin/devagent --version
          /tmp/devagent-release-smoke/bin/devagent --help >/dev/null
          /tmp/devagent-release-smoke/bin/python -m pip check

      - name: Check existing tag and release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          git fetch --tags --prune

          TAG_EXISTS=false
          TAG_SHA=""
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_EXISTS=true
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$TAG_EXISTS" != "true" ]; then
              echo "Release $TAG exists but its Git tag is missing." >&2
              exit 1
            fi
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "Release $TAG already exists at $TAG_SHA, expected $RELEASE_SHA" >&2
              exit 1
            fi
            echo "Release $TAG already exists at $TAG_SHA."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$TAG_EXISTS" = "true" ] && [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "Existing tag $TAG points to $TAG_SHA, expected release commit $RELEASE_SHA" >&2
              exit 1
            fi
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub release
        if: steps.existing.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "DevAgent $TAG" \
            --generate-notes
