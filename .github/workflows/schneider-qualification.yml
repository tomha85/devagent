name: Schneider Production Qualification

on:
  push:
    branches: [main, "feat/schneider-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schneider-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schneider:
    name: Schneider Control Expert V1-V8 production qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact qualified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile PLC sources
        run: |
          python -m compileall -q \
            devagent/plc \
            scripts/qualify_schneider_v1.py \
            scripts/qualify_schneider_v2.py \
            scripts/qualify_schneider_v3.py \
            scripts/qualify_schneider_v4.py \
            scripts/qualify_schneider_v5.py \
            scripts/qualify_schneider_v6.py \
            scripts/qualify_schneider_v7.py \
            scripts/qualify_schneider_v8.py

      - name: Run complete PLC regression suite
        run: python -m pytest -q tests/test_plc*.py

      - name: Run Schneider Control Expert V1 qualification
        run: python scripts/qualify_schneider_v1.py

      - name: Run Schneider Control Expert V2 qualification
        run: python scripts/qualify_schneider_v2.py

      - name: Run Schneider Control Expert V3 qualification
        run: python scripts/qualify_schneider_v3.py

      - name: Run Schneider Control Expert V4 qualification
        run: python scripts/qualify_schneider_v4.py

      - name: Run Schneider Control Expert V5 qualification
        run: python scripts/qualify_schneider_v5.py

      - name: Run Schneider Control Expert V6 qualification
        run: python scripts/qualify_schneider_v6.py

      - name: Run Schneider Control Expert V7 qualification
        run: python scripts/qualify_schneider_v7.py

      - name: Run Schneider Control Expert V8 qualification
        run: python scripts/qualify_schneider_v8.py --report .devagent/schneider-production-qualification-v8.json

      - name: Record exact qualification revision
        env:
          QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INTEGRATION_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "devagent-schneider-qualified-head-v8",
              "commit_sha": os.environ["QUALIFIED_SHA"],
              "integration_sha": os.environ["INTEGRATION_SHA"],
              "qualified": True,
              "checks": {
                  "plc_regression_suite": "PASS",
                  "schneider_control_expert_v1": "PASS",
                  "schneider_control_expert_v2": "PASS",
                  "schneider_control_expert_v3": "PASS",
                  "schneider_control_expert_v4": "PASS",
                  "schneider_control_expert_v5": "PASS",
                  "schneider_control_expert_v6": "PASS",
                  "schneider_control_expert_v7": "PASS",
                  "schneider_control_expert_v8": "PASS",
              },
              "supported_input_contract": {
                  "primary": ".XEF",
                  "granular": [".XSY", ".XST", ".XLD", ".XBD", ".XSF", ".XIL", ".XDD", ".XDB", ".XHW", ".XCM"],
                  "work_archive_requires_export": [".STU", ".STA", ".ZEF"],
              },
              "v2_static_theorem": {
                  "surface": "ST",
                  "control_flow": "complete top-level IF/ELSIF/ELSE Boolean final-value chains",
                  "fail_closed": [
                      "missing ELSE",
                      "missing output assignment",
                      "duplicate branch write",
                      "nested IF",
                      "IF enclosed by CASE/FOR/WHILE/REPEAT",
                      "calls",
                      "self/cyclic output dependency",
                      "duplicate section identity",
                      "unsupported expression",
                      "theorem-size overflow",
                  ],
              },
              "v3_dfb_closure": {
                  "surface": "XDB/XEF DFB + ST call sites",
                  "proof": "exact DFB instance/type/interface closure with bounded Boolean theorem projection",
                  "binding_is_arbitrary_runtime_proof": False,
                  "fail_closed": [
                      "guarded call",
                      "positional binding",
                      "complex actual expression",
                      "unknown or ambiguous instance",
                      "unknown or ambiguous DFB type",
                      "protected or unavailable DFB body",
                      "recursive DFB call cycle",
                      "type mismatch",
                      "competing output writer",
                      "non-Boolean or stateful behavior outside local theorem",
                  ],
              },
              "v4_graphical_semantics": {
                  "surface": "XLD/XBD/XEF graphical section XML",
                  "ld_proof": "whole-network cell graph for open/closed Boolean contacts, HLink/VLink/shortCircuit series-parallel connectivity, and normal coils",
                  "fbd_proof": "stateless AND/AND_BOOL/OR/OR_BOOL Boolean blocks with exact effectiveParameter/linkFB binding",
                  "legacy_per_typeLine_ld_proof_retired": True,
                  "fail_closed": [
                      "P/N edge contact",
                      "set/reset/not/edge/call/halt coil",
                      "compare or operate block",
                      "FFB/DFB/EFB state in LD",
                      "jump/return/control flow",
                      "timer/counter/stateful FBD block",
                      "EN/ENO execution gating",
                      "ambiguous or multiply driven FBD input",
                      "unresolved or non-Boolean symbol",
                      "signal cycle",
                      "competing output writer",
                      "unsupported or invalid cell geometry",
                  ],
              },
              "v5_state_machine": {
                  "surface": "XST/XEF Control Expert ST CASE",
                  "proof": "bounded source transition relation for one exported integer state tag with canonical numeric states and direct/Boolean guarded writes",
                  "runtime_sequence_pass_claimed": False,
                  "fail_closed": [
                      "nested CASE",
                      "nested IF transition arm",
                      "CASE ELSE behavior",
                      "FOR/WHILE/REPEAT control",
                      "non-integer or unresolved state tag",
                      "named/enum/typed state identity before V8",
                      "out-of-range state value",
                      "complex state target expression",
                      "unsupported or state-writing call",
                      "timer/counter output binding",
                      "guard depending on in-scan non-state write",
                      "unsupported/non-Boolean/impossible guard",
                      "dangling transition target",
                      "overlapping different-target guards",
                      "competing state writer",
                      "multiple CASE machines for one state tag",
                  ],
                  "runtime_evidence_required": [
                      "startup/reset state",
                      "retentivity",
                      "timer/counter evolution",
                      "scan/order timing",
                      "I/O timing",
                      "process physics",
                  ],
              },
              "v6_interlock_permissive": {
                  "surface": "FULL V1-V5 Boolean output theorems and V5 CASE transition guard DNF",
                  "proof": "exact every-path Boolean guard dominance for one output TRUE theorem or grouped same-state/source/target transition relation",
                  "same_source_target_transitions_grouped": True,
                  "role_classification": "token-based exported tag name/description only",
                  "safe_polarity_inferred_from_role": False,
                  "restrictive_requirement_requires_explicit_boolean_values": True,
                  "fail_closed": [
                      "PARTIAL parent theorem",
                      "duplicate output theorem",
                      "non-unique requirement target",
                      "guard absent from any required path",
                      "guard polarity contradicts source",
                      "runtime timer/counter transition dependency",
                      "unclassified engineering intent",
                  ],
                  "not_claimed": [
                      "SIL or performance-level certification",
                      "physical de-energization",
                      "process safety",
                      "scan or I/O timing",
                      "timer/counter evolution",
                  ],
              },
              "v7_fault_recovery": {
                  "surface": "V6 grouped CASE transition guard contracts over V5 canonical numeric state machines",
                  "proof": "bounded fault-entry and recovery topology with every-exit strong recovery dominance",
                  "numeric_state_value_implies_fault": False,
                  "fault_identity": "positive fault/error/trip/alarm/emergency token must dominate every bounded incoming route used to classify a fault-associated state",
                  "recovery_authorization": "reset/recover/ack/clear token with exact source polarity must dominate every modeled non-fault exit path",
                  "restart_name_is_recovery_authorization": False,
                  "detects": [
                      "ambiguous fault-state entry",
                      "fault recovery gap",
                      "recovery bypass path",
                      "uncommanded fault-state exit",
                      "stale-command restart path",
                      "competing recovery target overlap",
                  ],
                  "runtime_evidence_required": [
                      "cold/warm restart",
                      "retentivity",
                      "application download/restart",
                      "stale command values",
                      "scan and task ordering",
                      "field I/O",
                      "process-safe recovery",
                  ],
                  "not_claimed": [
                      "SIL or performance-level certification",
                      "physical safe state",
                      "Control Expert Simulator execution",
                      "HIL execution",
                      "real Modicon PLC execution",
                  ],
              },
              "v8_identity_types_io": {
                  "surface": "XEF plus granular XSY/XST/XLD/XBD/XSF/XIL/XDD/XDB/XHW/XCM engineering identity metadata",
                  "proof": "project-wide canonical controller symbol, DDT/ARRAY member, DFB instance/interface, located/topological I/O, and source read/write identity",
                  "project_identity": "controller plus exact source SHA256 plus engineering tool",
                  "ddt_member_flattening_allowed": False,
                  "array_dynamic_index_runtime_proof": False,
                  "dfb_instance_identity_is_runtime_behavior_proof": False,
                  "typed_boolean_requirement": "FULL Boolean theorem outputs and dependencies must resolve to BOOL/EBOOL/BOOLEAN canonical types",
                  "fail_closed": [
                      "unresolved canonical reference",
                      "conflicting duplicate symbol type",
                      "conflicting duplicate exported address",
                      "DDT/DFB member leaking into controller-root identity",
                      "non-Boolean typed value used by a syntactic Boolean theorem",
                      "whole-structure/member writer ownership overlap",
                      "distinct referenced symbols sharing one located physical address",
                      "recursive type expansion beyond bound",
                  ],
                  "not_claimed": [
                      "dynamic array index runtime value",
                      "field wiring correctness",
                      "I/O channel health",
                      "force state",
                      "I/O refresh timing",
                      "downloaded-controller/export equivalence",
                      "Control Expert Simulator execution",
                      "HIL execution",
                      "real Modicon PLC execution",
                      "SIL or performance-level certification",
                  ],
              },
              "external_evidence_gates": {
                  "real_control_expert_export_corpus": "REQUIRED_FOR_COMMERCIAL_CLOSEOUT",
                  "control_expert_simulator_hil_real_plc_execution": "NOT_EXECUTED",
              },
          }
          path = Path(".devagent/schneider-qualified-head.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Upload Schneider qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schneider-production-qualification-v8
          path: |
            .devagent/schneider-production-qualification-v1.json
            .devagent/schneider-production-qualification-v2.json
            .devagent/schneider-production-qualification-v3.json
            .devagent/schneider-production-qualification-v4.json
            .devagent/schneider-production-qualification-v5.json
            .devagent/schneider-production-qualification-v6.json
            .devagent/schneider-production-qualification-v7.json
            .devagent/schneider-production-qualification-v8.json
            .devagent/schneider-qualified-head.json
          if-no-files-found: warn
