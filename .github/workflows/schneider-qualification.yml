name: Schneider Production Qualification

on:
  push:
    branches: [main, "feat/schneider-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schneider-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schneider:
    name: Schneider Control Expert V1-V7 production qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact qualified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile PLC sources
        run: |
          python -m compileall -q \
            devagent/plc \
            scripts/qualify_schneider_v1.py \
            scripts/qualify_schneider_v2.py \
            scripts/qualify_schneider_v3.py \
            scripts/qualify_schneider_v4.py \
            scripts/qualify_schneider_v5.py \
            scripts/qualify_schneider_v6.py \
            scripts/qualify_schneider_v7.py

      - name: Run complete PLC regression suite
        run: python -m pytest -q tests/test_plc*.py

      - name: Run Schneider Control Expert V1 qualification
        run: python scripts/qualify_schneider_v1.py

      - name: Run Schneider Control Expert V2 qualification
        run: python scripts/qualify_schneider_v2.py

      - name: Run Schneider Control Expert V3 qualification
        run: python scripts/qualify_schneider_v3.py

      - name: Run Schneider Control Expert V4 qualification
        run: python scripts/qualify_schneider_v4.py

      - name: Run Schneider Control Expert V5 qualification
        run: python scripts/qualify_schneider_v5.py

      - name: Run Schneider Control Expert V6 qualification
        run: python scripts/qualify_schneider_v6.py

      - name: Run Schneider Control Expert V7 qualification
        run: python scripts/qualify_schneider_v7.py

      - name: Record exact qualification revision
        env:
          QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INTEGRATION_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "devagent-schneider-qualified-head-v7",
              "commit_sha": os.environ["QUALIFIED_SHA"],
              "integration_sha": os.environ["INTEGRATION_SHA"],
              "qualified": True,
              "checks": {
                  "plc_regression_suite": "PASS",
                  "schneider_control_expert_v1": "PASS",
                  "schneider_control_expert_v2": "PASS",
                  "schneider_control_expert_v3": "PASS",
                  "schneider_control_expert_v4": "PASS",
                  "schneider_control_expert_v5": "PASS",
                  "schneider_control_expert_v6": "PASS",
                  "schneider_control_expert_v7": "PASS",
              },
              "supported_input_contract": {
                  "primary": ".XEF",
                  "granular": [".XSY", ".XST", ".XLD", ".XBD", ".XSF", ".XIL", ".XDD", ".XDB", ".XHW", ".XCM"],
                  "work_archive_requires_export": [".STU", ".STA", ".ZEF"],
              },
              "v7_fault_recovery": {
                  "surface": "V6 grouped CASE transition guard contracts over V5 numeric state machines",
                  "fault_identity": "positive fault/error/trip/alarm/emergency token must dominate every bounded incoming route used to classify a fault-associated state",
                  "recovery_authorization": "reset/recover/ack/clear token with exact source polarity must dominate every modeled exit path",
                  "restart_name_is_recovery_authorization": False,
                  "detects": [
                      "fault recovery gap",
                      "recovery bypass path",
                      "uncommanded exit from fault-associated state",
                      "stale-command restart path",
                      "competing recovery target overlap",
                      "ambiguous fault-state entry",
                  ],
                  "runtime_evidence_required": [
                      "cold/warm restart",
                      "retentivity",
                      "application download/restart",
                      "stale command values",
                      "scan and task ordering",
                      "field I/O",
                      "process-safe recovery",
                  ],
                  "not_claimed": [
                      "SIL or performance-level certification",
                      "physical safe state",
                      "Control Expert Simulator execution",
                      "HIL execution",
                      "real Modicon PLC execution",
                  ],
              },
              "external_evidence_gates": {
                  "real_control_expert_export_corpus": "REQUIRED_FOR_COMMERCIAL_CLOSEOUT",
                  "control_expert_simulator_hil_real_plc_execution": "NOT_EXECUTED",
              },
          }
          path = Path(".devagent/schneider-qualified-head.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Upload Schneider qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schneider-production-qualification-v7
          path: |
            .devagent/schneider-production-qualification-v1.json
            .devagent/schneider-production-qualification-v2.json
            .devagent/schneider-production-qualification-v3.json
            .devagent/schneider-production-qualification-v4.json
            .devagent/schneider-production-qualification-v5.json
            .devagent/schneider-production-qualification-v6.json
            .devagent/schneider-production-qualification-v7.json
            .devagent/schneider-qualified-head.json
          if-no-files-found: warn
