name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Release version after green main CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release publication
    if: >-
      github.event_name == 'release' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish_needed: ${{ steps.pypi.outputs.publish_needed }}

    steps:
      - name: Checkout verified main revision for workflow-run releases
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$(python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          assert project['name'] == 'devagent-ai', project['name']
          print('v' + project['version'])
          PY
          )"
          fi

          if [ -z "$TAG" ]; then
            echo "Could not resolve release tag." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Verify GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Check whether version already exists on PyPI
        id: pypi
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          version = os.environ['TAG'].removeprefix('v')
          url = f'https://pypi.org/pypi/devagent-ai/{version}/json'
          publish_needed = True
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  if response.status == 200:
                      publish_needed = False
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"publish_needed={'true' if publish_needed else 'false'}\n")
          print(
              f'devagent-ai {version} is '
              + ('not yet on PyPI; publishing is required.' if publish_needed else 'already on PyPI; publishing is skipped.')
          )
          PY

  build:
    name: Build exact release distributions
    needs: resolve
    if: needs.resolve.outputs.publish_needed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build and validate distributions
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          expected = os.environ['RELEASE_TAG'].removeprefix('v')
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          assert project['name'] == 'devagent-ai', project['name']
          assert project['version'] == expected, (project['version'], expected)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ needs.resolve.outputs.tag }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish package
    needs: [resolve, build]
    if: >-
      needs.resolve.outputs.publish_needed == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/devagent-ai/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions-${{ needs.resolve.outputs.tag }}
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
