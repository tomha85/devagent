name: Temporary Functional Qualification v0.4

on:
  push:
    branches:
      - feat/functional-qualification-v040

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/functional-qualification-v040
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply truth-semantics and CI patches
        run: |
          python .devagent-functional-qualification-patch.py
          python .devagent-functional-qualification-ci.py

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q devagent tests

      - name: Full tests with coverage
        run: |
          python -m pytest -q \
            --cov=devagent \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Functional qualification catalog
        run: |
          python -m devagent.qualification \
            --catalog evaluation/benchmark_v2.json \
            --report .devagent/functional-qualification.json

      - name: Diff check
        run: git diff --check

      - name: Commit verified product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            devagent/evaluation.py \
            devagent/qualification.py \
            evaluation/README.md \
            evaluation/benchmark_v2.json \
            tests/test_evaluation_harness.py \
            tests/test_functional_qualification.py \
            .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add functional qualification gate'
          git push origin HEAD:feat/functional-qualification-v040
