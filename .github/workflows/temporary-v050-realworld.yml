name: Temporary v0.5 Real-world Benchmark Qualification

on:
  push:
    branches: [feat/realworld-benchmark-large-repo-v050]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-v050-realworld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/realworld-benchmark-large-repo-v050
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm qualification toolchains
        run: |
          python --version
          node --version
          npm --version
          go version
          cargo --version
          c++ --version | head -1
          make --version | head -1

      - name: Apply v0.5 candidate patch
        run: python .devagent-v050-patch-wrapper.py

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q devagent tests

      - name: Targeted v0.5 tests
        run: |
          python -m pytest -q \
            tests/test_retrieval.py \
            tests/test_realworld_benchmark.py \
            tests/test_cli.py

      - name: Full tests with coverage
        run: |
          python -m pytest -q \
            --cov=devagent \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Production qualification v4
        run: |
          python -m devagent.qualification \
            --catalog evaluation/benchmark_v4.json \
            --report .devagent/production-qualification-v4.json

      - name: CLI benchmark smoke
        run: |
          devagent --version
          devagent benchmark --help >/dev/null

      - name: Diff check
        run: git diff --check

      - name: Commit verified candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            devagent/__init__.py \
            devagent/cli.py \
            devagent/discovery.py \
            devagent/qualification.py \
            devagent/realworld.py \
            devagent/retrieval.py \
            devagent/workspace.py \
            tests/test_cli.py \
            tests/test_realworld_benchmark.py \
            tests/test_retrieval.py \
            evaluation/benchmark_v4.json \
            .github/workflows/ci.yml \
            docs/realworld-benchmark.md \
            README.md \
            CHANGELOG.md \
            pyproject.toml
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add real-world benchmark and large-repo hardening'
          git push origin HEAD:feat/realworld-benchmark-large-repo-v050
