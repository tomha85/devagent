name: README v0.8 materializer

on:
  push:
    branches:
      - docs/readme-v080-status

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-v080-status
      - name: Update README status
        run: python .github/scripts/update_readme_v080.py
      - name: Commit README when changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README for v0.8 verified core"
          git push origin HEAD:docs/readme-v080-status
