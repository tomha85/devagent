name: Schneider V9 Commercial Closeout

on:
  push:
    branches: [main, "feat/schneider-*"]
    paths:
      - "devagent/plc/schneider_*.py"
      - "tests/test_plc_schneider*.py"
      - "scripts/qualify_schneider_v9.py"
      - ".github/workflows/schneider-v9-closeout.yml"
  pull_request:
    branches: [main]
    paths:
      - "devagent/plc/schneider_*.py"
      - "tests/test_plc_schneider*.py"
      - "scripts/qualify_schneider_v9.py"
      - ".github/workflows/schneider-v9-closeout.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schneider-v9-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schneider-v9:
    name: Schneider Control Expert V9 commercial closeout
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact qualified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile Schneider V9 sources
        run: |
          python -m compileall -q \
            devagent/plc \
            scripts/qualify_schneider_v9.py \
            tests/test_plc_schneider_v9.py

      - name: Run Schneider regression suite
        run: python -m pytest -q tests/test_plc_schneider*.py

      - name: Run Schneider V9 qualification
        run: python scripts/qualify_schneider_v9.py --report .devagent/schneider-production-qualification-v9.json

      - name: Record exact V9 qualification revision
        env:
          QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INTEGRATION_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "devagent-schneider-qualified-head-v9",
              "commit_sha": os.environ["QUALIFIED_SHA"],
              "integration_sha": os.environ["INTEGRATION_SHA"],
              "qualified": True,
              "scope": "Schneider V9 commercial/source-support closeout",
              "prerequisite_workflow": "Schneider Production Qualification V1-V8",
              "checks": {
                  "schneider_regression_suite": "PASS",
                  "schneider_control_expert_v9": "PASS",
              },
              "support_contract": {
                  "source_statement_accounting": "REQUIRED",
                  "source_section_accounting": "REQUIRED",
                  "protected_dfb_accounting": "REQUIRED",
                  "dfb_call_accounting": "REQUIRED",
                  "deterministic_bundle_manifest": "REQUIRED",
                  "metadata_consistency": "FAIL_CLOSED",
                  "unsupported_regions_visible": True,
              },
              "supported_input_contract": {
                  "primary": ".XEF",
                  "granular": [".XSY", ".XST", ".XLD", ".XBD", ".XSF", ".XIL", ".XDD", ".XDB", ".XHW", ".XCM"],
                  "work_archive_requires_export": [".STU", ".STA", ".ZEF"],
              },
              "external_evidence_gates": {
                  "real_control_expert_export_corpus": "PENDING_EXTERNAL_EVIDENCE",
                  "required_real_export_families": [
                      "M340",
                      "M580",
                      "legacy Unity Pro",
                      "mixed ST+LD+FBD",
                      "DFB+DDT",
                      "CASE/state-machine",
                      "interlock/fault/recovery",
                      "large industrial project",
                  ],
                  "control_expert_simulator": "NOT_EXECUTED",
                  "hil": "NOT_EXECUTED",
                  "real_modicon_plc": "NOT_EXECUTED",
              },
              "commercial_claim_boundary": (
                  "Static implementation closeout only. Customer export corpus and runtime execution remain external qualification evidence."
              ),
          }
          path = Path(".devagent/schneider-qualified-head-v9.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Upload Schneider V9 closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schneider-production-qualification-v9
          path: |
            .devagent/schneider-production-qualification-v9.json
            .devagent/schneider-qualified-head-v9.json
          if-no-files-found: warn
