name: Temporary v0.5.1 Trust Security

on:
  push:
    branches: [feat/v051-trust-security]

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feat/v051-trust-security
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply candidate patch
        run: |
          python .devagent-v051-patch.py
          python .devagent-v051-version-fix.py
          python .devagent-v051-routing-test-fix.py
          python .devagent-v051-eof-fix.py

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q devagent

      - name: Run targeted trust-security tests
        run: |
          python -m pytest -q \
            tests/test_cli.py::test_doctor_live_probes_default_and_role_models \
            tests/test_cli.py::test_doctor_live_failure_returns_nonzero \
            tests/test_cli.py::test_explicit_provider_switch_does_not_inherit_previous_base_url \
            tests/test_cli.py::test_models_show_bounded_provider_qualification \
            tests/test_source_control_publish.py::test_publication_disables_repository_git_hooks

      - name: Run full suite with coverage
        run: |
          python -m pytest -q --cov=devagent --cov-report=term-missing --cov-fail-under=75

      - name: Run Production Qualification v4
        run: |
          python -m devagent.qualification \
            --catalog evaluation/benchmark_v4.json \
            --report .devagent/production-qualification-v4.json

      - name: Verify CLI and patch
        run: |
          devagent --version
          devagent doctor --help | grep -- '--live'
          devagent models >/dev/null
          git diff --check

      - name: Commit verified product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            devagent/config.py \
            devagent/routing.py \
            devagent/cli.py \
            devagent/source_control.py \
            devagent/__init__.py \
            tests/test_cli.py \
            tests/test_model_routing.py \
            tests/test_source_control_publish.py \
            tests/test_production_v040.py \
            evaluation/benchmark_v4.json \
            pyproject.toml \
            README.md \
            CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix: harden provider trust and Git publication v0.5.1'
          git push origin HEAD:feat/v051-trust-security
