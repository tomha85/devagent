name: Siemens Production Qualification

on:
  push:
    branches: [main, "feat/siemens-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siemens-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  siemens:
    name: Siemens TIA V5 qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact qualified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile PLC sources
        run: |
          python -m compileall -q \
            devagent/plc \
            scripts/qualify_siemens_v1.py \
            scripts/qualify_siemens_v2.py \
            scripts/qualify_siemens_v3.py \
            scripts/qualify_siemens_v4.py \
            scripts/qualify_siemens_v4_extended.py \
            scripts/qualify_siemens_v5.py

      - name: Run complete PLC regression suite
        run: python -m pytest -q tests/test_plc*.py

      - name: Run Siemens TIA V1 compatibility qualification
        run: |
          python scripts/qualify_siemens_v1.py \
            --report .devagent/siemens-production-qualification-v1.json

      - name: Run Siemens TIA V2 control-flow qualification
        run: |
          python scripts/qualify_siemens_v2.py \
            --report .devagent/siemens-production-qualification-v2.json

      - name: Run Siemens TIA V3 call-graph qualification
        run: |
          python scripts/qualify_siemens_v3.py \
            --report .devagent/siemens-production-qualification-v3.json

      - name: Run Siemens TIA V4 LAD/FBD Boolean qualification
        run: |
          python scripts/qualify_siemens_v4.py \
            --report .devagent/siemens-production-qualification-v4.json

      - name: Run Siemens TIA V4 extended action/call/runtime qualification
        run: |
          python scripts/qualify_siemens_v4_extended.py \
            --report .devagent/siemens-production-qualification-v4-extended.json

      - name: Run Siemens TIA V5 sequencing/state-machine qualification
        run: |
          python scripts/qualify_siemens_v5.py \
            --report .devagent/siemens-production-qualification-v5.json

      - name: Record exact qualification revision
        env:
          QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INTEGRATION_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema": "devagent-siemens-qualified-head-v1",
              "commit_sha": os.environ["QUALIFIED_SHA"],
              "integration_sha": os.environ["INTEGRATION_SHA"],
              "qualified": True,
              "checks": {
                  "plc_regression_suite": "PASS",
                  "siemens_v1": "PASS",
                  "siemens_v2": "PASS",
                  "siemens_v3": "PASS",
                  "siemens_v4_boolean": "PASS",
                  "siemens_v4_extended": "PASS",
                  "siemens_v5_state_machine": "PASS",
              },
          }
          path = Path(".devagent/siemens-qualified-head.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Upload Siemens qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siemens-production-qualification-v5
          path: |
            .devagent/siemens-production-qualification-v1.json
            .devagent/siemens-production-qualification-v2.json
            .devagent/siemens-production-qualification-v3.json
            .devagent/siemens-production-qualification-v4.json
            .devagent/siemens-production-qualification-v4-extended.json
            .devagent/siemens-production-qualification-v5.json
            .devagent/siemens-qualified-head.json
          if-no-files-found: warn
